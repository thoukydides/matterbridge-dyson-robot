name: 🐞 Bug report
description: "Report a bug or something that is otherwise not working as expected."
labels: ["bug"]

body:
  - type: checkboxes
    id: diagnostics
    attributes:
      label: Diagnostic Checklist
      description: "Check these common causes to rule out basic configuration or setup issues."
      options:
        - label: "MyDyson [iPhone](https://apps.apple.com/gb/app/mydyson/id993135524) or [Android](https://play.google.com/store/apps/details?id=com.dyson.mobile.android) app can control the appliance."
        - label: "Searched for [previously reported issues](https://github.com/thoukydides/matterbridge-dyson-robot/issues?q=is%3Aissue) and found none."
    validations:
      required: false
      
  - type: textarea
    id: description
    attributes:
      label: Description of Issue
      description: "Provide a clear and concise description of the bug."
      placeholder: |
        Describe what is going wrong, the symptoms, the frequency, and any recent changes.
        What did you expect to happen? What actually happened?
    validations:
      required: true
    
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: "Provide a step-by-step description of how to reproduce the issue."
      placeholder: |
        Steps to reproduce:
        1. ...
        2. ...
    validations:
      required: true
  
  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: "State the plugin version exhibiting the bug. If not using the latest version, please update before reporting."
    validations:
      required: true
      
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Describe the software environment being used to run this plugin. Include:
        - Operating System type and version (output of `lsb_release -d` or `cat /etc/os-release` on Linux)
        - Node.js version (output of `node -v` or reported in Matterbridge frontend)
        - Matterbridge version (output of `npm -g ls matterbridge` or reported in Matterbridge frontend)
      placeholder: |
        - OS: e.g. Ubuntu 24.04.1 LTS or macOS Ventura 13.5
        - Node: e.g. v22.15.0
        - Matterbridge: e.g. 3.0.0
    validations:
      required: true

  - type: input
    id: appliance
    attributes:
      label: Dyson Appliance(s)
      description: "Specify the model name and number of the Dyson appliance that the issue relates to. These details can be found behind the clear bin on robot vacuums, or on the base of air treatment devices."
      placeholder: "e.g. Dyson 360 Vis Nav RB03"
    validations:
      required: true
      
  - type: input
    id: topic
    attributes:
      label: Dyson MQTT Root Topic
      description: "Specify the MQTT root topic used to communicate with this appliance. This can be found in the plugin's log."
      placeholder: "e.g. N223 or 664"
    validations:
      required: true
      
  - type: input
    id: firmware
    attributes:
      label: Dyson Firmware Version
      description: "Specify the appliance's firmware version. This can be found in the MyDyson app under the device's settings."
      placeholder: "e.g. RB03PR.01.08.006.5079"
    validations:
      required: true
      
  - type: input
    id: mattercontroller
    attributes:
      label: Matter Controller(s)
      description: "Provide details of the Matter controller(s) being used, including their versions."
      placeholder: "e.g. Apple Home iOS 18.4, Amazon Alexa, Google Home, Samsung SmartThings, Home Assistant 2025.4.3, etc."
    validations:
      required: false
      
  - type: textarea
    id: log
    attributes:
      label: Log File
      description: |
        Provide relevant Matterbridge logs, either pasted below or attached as a text file. Do NOT use a screenshot. Replace sensitive information (access tokens, etc) with `REDACTED`. Logs are most useful when they are complete; include the full output around the error message and do not omit any lines. Avoid using AI tools to condense or reformat logs.

        Enable and capture appropriate extra debug:
        
        - **For Plugin Debug Logging** (enable for most issues):
          - In Matterbridge frontend: *Home* > *Plugins* > *matterbridge-dyson-robot* > ⚙️ > *debug* > ✅
            - Or in the `matterbridge-dyson-robot.config.json` file: `"debug": true`
          - View the log file directly (e.g. `journalctl -u matterbridge.service -n 1000 -f --output cat`); the Matterbridge frontend normally filters out debug messages and mangles whitespace.
          
        - **For Dyson MQTT Logging (enable for any Dyson interoperability issues)**:
          - In Matterbridge frontend: *Home* > *Plugins* > *matterbridge-dyson-robot* > ⚙️ > *Enable advanced debug option* > *Log MQTT Payloads as JSON* and *wildcardTopic* > ✅
            - Or in the `matterbridge-dyson-robot.config.json` file: `"debugFeatures": ["Log MQTT Payloads as JSON"], "wildcardTopic": true`
          
        - **For Matterbridge Logging**:
          - In Matterbridge frontend: *Settings* > *Matterbridge settings* > *Logger level* > *Debug*.
            - Or add `-logger debug` to the `matterbridge` command line.
          
        - **For Matter Logging**:
          - In Matterbridge frontend: *Settings* > *Matter settings* > *Logger level* > *Debug*.
            - Or add `-matterlogger debug` to the `matterbridge` command line.
        
        The additional debug information in the logs will provide more context for resolving your issue.
      placeholder: |
        Paste the logs...
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: "Provide your `matterbridge-dyson-robot.config.json` (if relevant). This is optional but highly recommended. Replace sensitive information (API Key and Access/Refresh Tokens) with `REDACTED`."
      placeholder: "Paste configuration..."
      render: json
    validations:
      required: false
   
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: |
        Provide any additional information that might assist with resolving your bug report. This could include links to product web pages, user manuals, screenshots, videos, or anything else relevant. If you have tried workarounds or debugging steps, include them here.
        
        For robot vacuums also use a Man-In-The-Middle (MITM) proxy to capture the MyDyson app's API requests. For example, using the Proxyman app:

        - Install [Proxyman for iOS](https://apps.apple.com/gb/app/proxyman/id1551292695) or [Proxyman for Android](https://play.google.com/store/apps/details?id=com.proxyman.proxymanandroid). (The free version is sufficient; Pro features are not required.)
          - Open Proxyman and follow the **How to setup** instructions on the **More** tab to install and trust the root CA certificate.
          - Under **SSL Proxying List**, add `appapi.cp.dyson.com` and enable it.
          - Start the VPN proxy in Proxyman and verify `Ready to intercept` is displayed.
          - Open the MyDyson app.
          - In Proxyman's **Home** tab, locate `appapi.cp.dyson.com` to confirm requests are being actively captured and decrypted.
        - Exercise as much of the robot vacuum's functionality as possible using the MyDyson app, keeping a note of the sequence of operations performed. Include at least the following:
          - Start all types of global clean (e.g. different vacuum power levels, mop settings).
          - Abort an active global clean mid-cycle.
          - Start zone-configured cleaning with varied settings per zone (vacuum-only, mop-only, vacuum-and-mop, vacuum-then-mop).
          - Allow a full cleaning cycle to complete naturally (including dock departure and post-clean maintenance).
          - Load and view the most recent cleaned area map in the app.
        - Return to Proxyman and disable the VPN.
        - Select `appapi.cp.dyson.com` on the **Home** tab, tap the settings/cog icon, choose **Share**, and **Save to Files**. This generates a `.proxymanlogv2` archive (a Zip archive containing a JSON representation of each captured request). Attach the saved file (not a screenshot) here.
      placeholder: "Any other relevant information..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Important Notes:**
        - 🐞 Most issues cannot be diagnosed without complete debug logs; please include them.
        - 🔐 Ensure sensitive information like tokens or passwords are `REDACTED` before sharing.
        - 🔄 Always update to the latest plugin version before reporting bugs.
        - 🧪 This is a personal project, so not all issues may be investigated or resolved. Please do not take it personally.